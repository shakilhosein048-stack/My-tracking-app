<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জার্নি ট্র্যাকার প্রো - শাকিল হোসেন</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 40px;
            margin-bottom: 5px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
        }
        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }
        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
            display: block;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        #map {
            height: 300px;
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">📍</div>
        <h1 class="title">জার্নি ট্র্যাকার প্রো</h1>
        <p class="subtitle">শাকিল হোসেন দ্বারা তৈরি</p>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <span class="stat-label">গতি</span>
            <span id="speed" class="stat-value">0.0</span>
            <span class="stat-label">কিমি/ঘণ্টা</span>
        </div>

        <div class="stat-box">
            <span class="stat-label">দূরত্ব</span>
            <span id="distance" class="stat-value">0.00</span>
            <span class="stat-label">কিমি</span>
        </div>

        <div class="stat-box">
            <span class="stat-label">সময়</span>
            <span id="time" class="stat-value">00:00:00</span>
            <span class="stat-label">ঘণ্টা:মিনিট:সেকেন্ড</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // সময় আপডেট করার ফাংশন
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('bn-BD', { hour12: false });
            document.getElementById('time').innerText = timeString;
        }
        setInterval(updateTime, 1000); // প্রতি সেকেন্ডে সময় আপডেট হবে
        updateTime();

        // ম্যাপ সেটআপ (ঢাকা কেন্দ্রিক)
        var map = L.map('map').setView([23.8103, 90.4125], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // লোকেশন ট্র্যাকিং এবং গতির লজিক এখানে যোগ করা যাবে
    </script>
</body>
</html>
