<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জার্নি ট্র্যাকার প্রো</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .stats-container { display: flex; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 15px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; flex: 1; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-label { font-size: 14px; color: #666; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: bold; color: #1a73e8; }
        #map { height: 350px; width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-container { margin-top: 20px; width: 100%; max-width: 500px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .start-btn { background-color: #28a745; color: white; }
        .stop-btn { background-color: #dc3545; color: white; display: none; }
    </style>
</head>
<body>

    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-label">গতি</div>
            <div id="speed" class="stat-value">0.0</div>
            <div style="font-size: 10px; color: #999;">কিমি/ঘণ্টা</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">সময়</div>
            <div id="timer-display" class="stat-value">00:00:00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">দূরত্ব</div>
            <div id="distance" class="stat-value">0.00</div>
            <div style="font-size: 10px; color: #999;">কিমি</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="btn-container">
        <button id="startBtn" class="start-btn" onclick="startTracking()">■ ট্র্যাকিং শুরু করুন</button>
        <button id="stopBtn" class="stop-btn" onclick="stopTracking()">■ ট্র্যাকিং বন্ধ করুন</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker, watchID;
        let startTime, timerInterval;
        let totalDistance = 0, lastCoords = null;

        // ম্যাপ সেটআপ
        map = L.map('map').setView([23.8103, 90.4125], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([23.8103, 90.4125]).addTo(map);

        function startTracking() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            
            // টাইমার শুরু
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

            // লোকেশন ট্র্যাকিং শুরু
            watchID = navigator.geolocation.watchPosition(updatePosition, null, {
                enableHighAccuracy: true
            });
        }

        function updatePosition(position) {
            const { latitude, longitude, speed } = position.coords;
            const currentCoords = L.latLng(latitude, longitude);

            // ম্যাপ এবং মার্কার আপডেট
            map.setView(currentCoords, 17);
            marker.setLatLng(currentCoords);

            // গতি আপডেট (কিমি/ঘণ্টা)
            document.getElementById('speed').innerText = speed ? (speed * 3.6).toFixed(1) : "0.0";

            // দূরত্ব হিসাব
            if (lastCoords) {
                let d = map.distance(lastCoords, currentCoords);
                totalDistance += d / 1000;
                document.getElementById('distance').innerText = totalDistance.toFixed(2);
            }
            lastCoords = currentCoords;
        }

        function updateTimer() {
            let elapsedTime = Date.now() - startTime;
            let hrs = Math.floor(elapsedTime / 3600000);
            let mins = Math.floor((elapsedTime % 3600000) / 60000);
            let secs = Math.floor((elapsedTime % 60000) / 1000);

            document.getElementById('timer-display').innerText = 
                `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function stopTracking() {
            navigator.geolocation.clearWatch(watchID);
            clearInterval(timerInterval);
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            lastCoords = null;
        }
    </script>
</body>
</html>
